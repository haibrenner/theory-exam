<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תרגול תאוריה</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --border: #dddbd5;
    --accent: #2f5fd0; --opt-hover: #f0efe9;
    --right: #cfe2ff; --right-border: #1f63c6; --wrong: #f6cfcf; --wrong-border: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --card: #222226; --text: #ececee; --muted: #9a9aa2; --border: #3a3a40;
      --accent: #7fa2ff; --opt-hover: #2c2c32;
      --right: #1c3a6b; --right-border: #5b9dff; --wrong: #5a2323; --wrong-border: #e0605a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", Arial, "Noto Sans Hebrew", "Noto Sans Arabic", sans-serif; line-height: 1.5;
  }
  header {
    position: sticky; top: 0; z-index: 1; background: var(--bg);
    border-bottom: 1px solid var(--border); padding: 12px 16px;
  }
  .controls { max-width: 860px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  label { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  select, button, input[type=number] {
    font: inherit; font-size: 15px; color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px;
  }
  button { cursor: pointer; min-width: 80px; }
  button:disabled { opacity: .4; cursor: default; }
  .pager { display: flex; gap: 8px; align-items: center; flex: 1 1 100%; }
  .pager input[type=range] { flex: 1; accent-color: var(--accent); }
  .pager input[type=number] { width: 72px; }
  .info { font-size: 14px; color: var(--muted); white-space: nowrap; }
  @media (max-width: 600px) {
    .pager {
      display: grid; gap: 8px;
      grid-template-columns: auto 1fr auto;
      grid-template-areas: "prev info next" "slider slider num";
    }
    #prev { grid-area: prev; }
    #next { grid-area: next; }
    #pageInfo { grid-area: info; text-align: center; }
    #slider { grid-area: slider; width: 100%; min-width: 0; }
    #pageNum { grid-area: num; }
  }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  .q { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .disclaimer {
    font-size: 13px; color: var(--muted); margin: 0 0 16px; padding: 8px 12px;
    border: 1px dashed var(--border); border-radius: 8px;
  }
  .disclaimer summary { cursor: pointer; }
  .disclaimer .more { text-decoration: underline; }
  .disclaimer[open] .more { display: none; }
  .disclaimer p { margin: 8px 0 0; }
  .q-meta { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .q-text { font-size: 18px; font-weight: 700; margin: 0 0 12px; }
  .q img { display: block; max-width: 100%; max-height: 320px; margin: 0 auto 12px; border-radius: 6px; }
  .img-missing { font-size: 13px; color: var(--muted); font-style: italic; margin-bottom: 12px; }
  .opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .opts button {
    width: 100%; text-align: start; font-size: 16px; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card);
  }
  .opts button:not(:disabled):hover { background: var(--opt-hover); }
  .opts button:disabled { opacity: 1; cursor: default; }
  .opts button.right { background: var(--right); border-color: var(--right-border); }
  .opts button.wrong { background: var(--wrong); border-color: var(--wrong-border); }
  .letter { font-weight: 700; margin-inline-end: 6px; }
</style>
</head>
<body>
<header>
  <div class="controls">
    <label><span data-t="language"></span>
      <select id="lang">
        <option value="he" selected>עברית</option>
        <option value="ar">العربية</option>
        <option value="en">English</option>
      </select>
    </label>
    <label><span data-t="license"></span>
      <select id="license">
        <option value="B" selected></option>
        <option value="A"></option>
        <option value="C1"></option>
        <option value="C"></option>
        <option value="D"></option>
        <option value="1"></option>
      </select>
    </label>
    <label><span data-t="topic"></span>
      <select id="topic">
        <option value=""></option>
        <option value="laws"></option>
        <option value="safety"></option>
        <option value="signs"></option>
        <option value="vehicle"></option>
      </select>
    </label>
    <label><span data-t="perPage"></span>
      <select id="size">
        <option>1</option><option>5</option><option selected>10</option><option>20</option>
        <option>50</option><option>100</option><option value="all">ALL</option><option value="random">RANDOM</option>
      </select>
    </label>
    <span class="info" id="count"></span>
    <div class="pager">
      <button id="prev"></button>
      <input type="range" id="slider" min="1" value="1">
      <input type="number" id="pageNum" min="1" value="1">
      <span class="info" id="pageInfo"></span>
      <button id="next"></button>
    </div>
  </div>
</header>
<main>
  <details class="disclaimer">
    <summary><span data-t="disclaimerShort"></span> <span class="more" data-t="more"></span></summary>
    <p data-t="disclaimer"></p>
  </details>
  <div id="list"></div>
</main>

<script>
const DATA_VERSIONS = {"he": "af03d70942", "en": "d58621b0de", "ar": "f6458af065"};

const STRINGS = {
  he: {
    dir: 'rtl', title: 'תרגול תאוריה', letters: 'אבגד',
    language: 'שפה', license: 'רישיון', topic: 'נושא', perPage: 'שאלות בעמוד',
    licenses: { B: 'רכב פרטי', A: 'אופנוע', C1: 'משאית קלה', C: 'משאית כבדה', D: 'אוטובוס', 1: 'טרקטור' },
    topics: { '': 'כל הנושאים', laws: 'חוקי התנועה', safety: 'בטיחות', signs: 'תמרורים', vehicle: 'הכרת הרכב' },
    count: n => `${n} שאלות`, page: (p, n) => `עמוד ${p} מתוך ${n}`, pageLabel: 'מספר עמוד',
    prev: 'הקודם', next: 'הבא', randomNext: 'שאלה אקראית', random: 'אקראי',
    meta: (i, id, topic) => `${i}. שאלה מספר ${id} · ${topic}`,
    imgAlt: 'תמונה לשאלה', imgMissing: '(התמונה לשאלה זו אינה זמינה במאגר)',
    disclaimerShort: 'אתר לא רשמי, מבוסס על מאגר השאלות הרשמי של משרד התחבורה. השימוש חינמי.', more: 'פרטים נוספים',
    disclaimer: 'האתר מבוסס על מאגר השאלות הרשמי של משרד התחבורה והבטיחות בדרכים, המפורסם באתר data.gov.il, אך אינו מופעל על ידי הממשלה והתוכן בו אינו מאומת באופן מלא. זכויות היוצרים במאגר שייכות למדינת ישראל. השימוש במאגר נעשה בהתאם לתנאי השימוש ולרישיון הפתוח שבו פורסם, תוך ציון המקור, במסגרת שימוש הוגן וללא שינוי בתוכן השאלות והתשובות. הנתונים מעודכנים ל-10 באוקטובר 2026. השימוש באתר חינמי.',
    loading: 'טוען שאלות…', error: 'שגיאה בטעינת השאלות. נסו לרענן את הדף.',
  },
  en: {
    dir: 'ltr', title: 'Theory Practice', letters: 'ABCD',
    language: 'Language', license: 'License', topic: 'Topic', perPage: 'Per page',
    licenses: { B: 'Private car', A: 'Motorcycle', C1: 'Light truck', C: 'Heavy truck', D: 'Bus', 1: 'Tractor' },
    topics: { '': 'All topics', laws: 'Traffic laws', safety: 'Safety', signs: 'Traffic signs', vehicle: 'Know your vehicle' },
    count: n => `${n} questions`, page: (p, n) => `Page ${p} of ${n}`, pageLabel: 'Page number',
    prev: 'Previous', next: 'Next', randomNext: 'Random question', random: 'Random',
    meta: (i, id, topic) => `${i}. Question no. ${id} · ${topic}`,
    imgAlt: 'Question image', imgMissing: '(The image for this question is not available)',
    disclaimerShort: 'Unofficial site, based on the official question pool of the Ministry of Transport. Free to use.', more: 'More details',
    disclaimer: 'This site is based on the official question pool of the Israeli Ministry of Transport and Road Safety, published on data.gov.il, but it is not operated by the government and its content has not been fully verified. Copyright in the question pool belongs to the State of Israel. The pool is used in accordance with the terms of use and the open license under which it was published, with attribution to the source, as fair use, and without changing the questions and answers. The data is current as of October 10, 2026. The site is free to use.',
    loading: 'Loading questions…', error: 'Failed to load the questions. Try refreshing the page.',
  },
  ar: {
    dir: 'rtl', title: 'تدريب النظري', letters: 'أبجد',
    language: 'اللغة', license: 'الرخصة', topic: 'الموضوع', perPage: 'أسئلة في الصفحة',
    licenses: { B: 'سيارة خصوصية', A: 'دراجة نارية', C1: 'شاحنة خفيفة', C: 'شاحنة ثقيلة', D: 'حافلة', 1: 'جرار' },
    topics: { '': 'كل المواضيع', laws: 'قوانين المرور', safety: 'السلامة على الطرق', signs: 'إشارات المرور', vehicle: 'معرفة المركبة' },
    count: n => `${n} سؤالاً`, page: (p, n) => `صفحة ${p} من ${n}`, pageLabel: 'رقم الصفحة',
    prev: 'السابق', next: 'التالي', randomNext: 'سؤال عشوائي', random: 'عشوائي',
    meta: (i, id, topic) => `${i}. سؤال رقم ${id} · ${topic}`,
    imgAlt: 'صورة السؤال', imgMissing: '(صورة هذا السؤال غير متوفرة)',
    disclaimerShort: 'موقع غير رسمي، يعتمد على بنك الأسئلة الرسمي لوزارة المواصلات. استخدام الموقع مجاني.', more: 'تفاصيل إضافية',
    disclaimer: 'يعتمد هذا الموقع على بنك الأسئلة الرسمي لوزارة المواصلات والأمان على الطرق، المنشور في موقع data.gov.il، لكنه لا يُدار من قبل الحكومة ولم يتم التحقق من محتواه بالكامل. حقوق الطبع والنشر لبنك الأسئلة محفوظة لدولة إسرائيل. يتم استخدام بنك الأسئلة وفقاً لشروط الاستخدام والرخصة المفتوحة التي نُشر بموجبها، مع ذكر المصدر، وضمن الاستخدام العادل، ودون تغيير في محتوى الأسئلة والأجوبة. البيانات محدّثة حتى 10 أكتوبر 2026. استخدام الموقع مجاني.',
    loading: 'جارٍ تحميل الأسئلة…', error: 'فشل تحميل الأسئلة. حاول تحديث الصفحة.',
  },
};

const $ = id => document.getElementById(id);
let lang = 'he', S = STRINGS.he, filtered = [], page = 1, randomIdx = -1;

const isRandom = () => $('size').value === 'random';
const pageSize = () => $('size').value === 'all' ? filtered.length || 1 : +$('size').value;
const pageCount = () => isRandom() ? 1 : Math.max(1, Math.ceil(filtered.length / pageSize()));

// Each language's questions live in data_<lang>.js and are loaded on first use.
function loadLanguage(l) {
  if (window.QUESTIONS && QUESTIONS[l]) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = `data_${l}.js?v=${DATA_VERSIONS[l]}`;
    s.onload = () => (window.QUESTIONS && QUESTIONS[l]) ? resolve() : reject(new Error(`no data in data_${l}.js`));
    s.onerror = () => reject(new Error(`could not load data_${l}.js`));
    document.head.append(s);
  });
}

function applyStrings() {
  document.documentElement.lang = lang;
  document.documentElement.dir = S.dir;
  document.title = S.title;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = S[el.dataset.t]);
  for (const o of $('license').options) o.textContent = `${o.value} – ${S.licenses[o.value]}`;
  for (const o of $('topic').options) o.textContent = S.topics[o.value];
  $('prev').textContent = S.prev;
  for (const id of ['slider', 'pageNum']) $(id).setAttribute('aria-label', S.pageLabel);
}

// keepPosition: stay on the same page / random question (used when only the language changes,
// since every language has the same questions in the same order).
function applyFilter(keepPosition) {
  const t = $('topic').value, lic = $('license').value;
  filtered = QUESTIONS[lang].filter(q => q.licenses.includes(lic) && (!t || q.topic === t));
  $('count').textContent = S.count(filtered.length);
  if (!keepPosition) {
    page = 1;
    randomIdx = -1;
    if (isRandom()) pickRandom();
  }
  render();
}

function pickRandom() {
  let i;
  do { i = Math.floor(Math.random() * filtered.length); } while (filtered.length > 1 && i === randomIdx);
  randomIdx = i;
}

function renderQuestion(q, index) {
  const el = document.createElement('section');
  el.className = 'q';
  el.innerHTML = `<div class="q-meta"></div><p class="q-text"></p>`;
  el.querySelector('.q-meta').textContent = S.meta(index, q.id, S.topics[q.topic]);
  el.querySelector('.q-text').textContent = q.text;
  if (q.image) {
    if (/^https?:\/\//.test(q.image)) {
      const img = new Image();
      img.loading = 'lazy';
      img.alt = S.imgAlt;
      img.src = q.image;
      img.onerror = () => img.replaceWith(missing());
      el.append(img);
    } else {
      el.append(missing());
    }
  }
  const ul = document.createElement('ul');
  ul.className = 'opts';
  q.options.forEach((text, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.innerHTML = `<span class="letter">${S.letters[i]}.</span>`;
    b.append(text);
    b.onclick = () => {
      const btns = ul.querySelectorAll('button');
      btns[q.answer].classList.add('right');
      if (i !== q.answer) b.classList.add('wrong');
      btns.forEach(x => x.disabled = true);
    };
    li.append(b);
    ul.append(li);
  });
  el.append(ul);
  return el;
}

function missing() {
  const d = document.createElement('div');
  d.className = 'img-missing';
  d.textContent = S.imgMissing;
  return d;
}

function render() {
  const list = $('list');
  list.textContent = '';
  const n = pageCount();
  page = Math.min(Math.max(1, page), n);

  const start = isRandom() ? randomIdx : (page - 1) * pageSize();
  const end = isRandom() ? (filtered.length ? randomIdx + 1 : 0) : page * pageSize();
  filtered.slice(start, end).forEach((q, i) => list.append(renderQuestion(q, start + i + 1)));

  $('prev').disabled = isRandom() || page <= 1;
  $('next').disabled = isRandom() ? filtered.length === 0 : page >= n;
  $('next').textContent = isRandom() ? S.randomNext : S.next;
  for (const id of ['slider', 'pageNum']) {
    $(id).max = n;
    $(id).value = page;
    $(id).disabled = isRandom() || n <= 1;
  }
  $('pageInfo').textContent = isRandom() ? S.random : S.page(page, n);
  window.scrollTo(0, 0);
}

function goTo(p) { page = +p || 1; render(); }

async function setLanguage(l, keepPosition) {
  lang = l;
  S = STRINGS[l];
  applyStrings();
  $('list').textContent = S.loading;
  try {
    await loadLanguage(l);
    applyFilter(keepPosition);
  } catch (e) {
    $('list').textContent = `${S.error} (${e.message})`;
  }
}

$('lang').onchange = e => setLanguage(e.target.value, true);
$('topic').onchange = $('license').onchange = () => applyFilter(false);
$('size').onchange = () => {
  page = 1;
  if (isRandom()) pickRandom();
  render();
};
$('prev').onclick = () => goTo(page - 1);
$('next').onclick = () => {
  if (isRandom()) { pickRandom(); render(); } else goTo(page + 1);
};
$('slider').oninput = e => { $('pageNum').value = e.target.value; $('pageInfo').textContent = S.page(e.target.value, pageCount()); };
$('slider').onchange = e => goTo(e.target.value);
$('pageNum').onchange = e => goTo(e.target.value);

// Always start in Hebrew, even if the browser restored another selection on reload.
$('lang').value = 'he';
setLanguage('he', false);
</script>
</body>
</html>
